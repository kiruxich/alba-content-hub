# Воркер + локальная Ollama, на которой он и думает. Модель качается один
# раз в volume ollama-models: без неё первый job упадёт с ошибкой "model not
# found", это не баг воркера.
#
#   docker compose up -d
#   docker compose exec ollama ollama pull qwen2.5:7b
#   docker compose exec ollama ollama pull nomic-embed-text
services:
  ollama:
    image: ollama/ollama:latest
    volumes:
      - ollama-models:/root/.ollama
    # Порт наружу не публикуем: к Ollama ходит только scrape-worker по
    # внутренней сети compose. Раскомментируйте, если нужен доступ с хоста.
    # ports: ["11434:11434"]
    restart: unless-stopped

  scrape-worker:
    build: .
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      SCRAPE_MODEL: ${SCRAPE_MODEL:-qwen2.5:7b}
      SCRAPE_EMBED_MODEL: ${SCRAPE_EMBED_MODEL:-nomic-embed-text}
      SCRAPE_WORKER_TOKEN: ${SCRAPE_WORKER_TOKEN}
    # Хостовый порт 8790, не 8788 - тот уже занят video-worker на этом же
    # сервере (см. infra/ansible/tasks/setup_selfhosted_ufw.yml). Внутри
    # контейнера uvicorn всё равно слушает 8788 (см. Dockerfile), меняется
    # только то, куда он проброшен наружу.
    ports:
      - "8790:8788"
    depends_on:
      - ollama
    restart: unless-stopped

volumes:
  ollama-models:
