# parser-worker and LibreTranslate are Coolify-managed resources now (git
# push / Docker Image, same as hub and alba-creation) - not provisioned by
# this playbook. That part is manual, one-time, via the Coolify UI:
#   - parser-worker: "Git Repository" -> this repo -> Build pack: Dockerfile,
#     Base directory: /parser-worker, Port mappings: 8787:8787,6080:6080,
#     env vars PARSER_WORKER_TOKEN / HUB_CALLBACK_URL / NOVNC_URL (the last
#     two reference hub.alba-creation.ru and the vnc_basic_auth_* below).
#   - libretranslate: "Docker Image" -> libretranslate/libretranslate:latest,
#     env vars LT_LOAD_ONLY=en,ru / LT_DISABLE_WEB_UI=true / LT_UPDATE_MODELS=false,
#     Ports exposes 5000, Port mappings 5000:5000.
#   - hub's own env vars then need PARSER_WORKER_URL=http://10.0.1.1:8787 and
#     LIBRETRANSLATE_URL=http://10.0.1.1:5000 (Coolify container names change
#     on every redeploy, so reaching either by container-name DNS doesn't
#     work - the docker bridge gateway + published host port is the only
#     stable address).
#
# What this playbook still owns at the VM level, because Coolify resources
# don't manage it themselves:

# A `creates:`-guarded `htpasswd -cb` shell would only ever run once - a
# later rerun with a rotated vnc_basic_auth_password would leave the old
# password in the htpasswd file. This module compares desired vs actual and
# updates in place either way.
- name: Создать/обновить пользователя basic-auth для noVNC
  community.general.htpasswd:
    path: /etc/nginx/.vnc_htpasswd
    name: "{{ vnc_basic_auth_user }}"
    password: "{{ vnc_basic_auth_password }}"
    mode: "0644"

- name: Разрешить порт parser-worker только из docker-подсети Coolify (не из интернета)
  community.general.ufw:
    rule: allow
    port: "8787"
    proto: tcp
    from_ip: 10.0.1.0/24
    comment: "parser-worker from coolify docker net"

- name: Разрешить порт LibreTranslate только из docker-подсети Coolify (не из интернета)
  community.general.ufw:
    rule: allow
    port: "5000"
    proto: tcp
    from_ip: 10.0.1.0/24
    comment: "libretranslate from coolify docker net"
