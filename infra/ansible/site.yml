---
# Провижининг сервера alba-creation.ru "с нуля": Docker+Coolify, nginx+SSL
# для доменов из vars/main.yml, Node.js+pm2 для приложений вне Coolify
# (сейчас это alba-creation.ru — крутится на pm2, деплоится отдельно, не
# этим плейбуком), plus 2ГИС parser-worker (Xvfb+noVNC+FastAPI) и LibreTranslate
# (перевод карточек идей на английский, без платного API).
#
# Запуск:
#   cd infra/ansible
#   ansible-playbook site.yml -e parser_worker_token=$(openssl rand -hex 24) -e vnc_basic_auth_password=$(openssl rand -hex 12)
#
# Требует коллекцию community.general (для модулей ufw и htpasswd):
#   ansible-galaxy collection install -r requirements.yml
#
# Идемпотентен — можно гонять повторно. Сертификаты Let's Encrypt для
# доменов, у которых DNS ещё не настроен на этот сервер, будут пропущены —
# перезапустите плейбук после того как DNS пропагируется.
#
# После первого прогона нужно вручную прописать в переменных окружения
# hub-приложения в Coolify: PARSER_WORKER_URL, PARSER_WORKER_TOKEN (тот же
# токен, что передали через -e выше) и LIBRETRANSLATE_URL=http://libretranslate:5000
# — плейбук не лезет в Coolify API.

- hosts: vps
  become: true
  vars_files:
    - vars/main.yml

  tasks:
    - name: Проверить, что секреты переданы явно (не оставлены дефолтом)
      assert:
        that:
          - parser_worker_token != 'CHANGE_ME'
          - vnc_basic_auth_password != 'CHANGE_ME'
        fail_msg: >
          parser_worker_token и/или vnc_basic_auth_password оставлены равны
          плейсхолдеру CHANGE_ME. Это реальный секрет worker-API и пароль от
          noVNC (удалённый доступ к живому Chromium-сеансу) — передайте оба
          явно: -e parser_worker_token=$(openssl rand -hex 24) -e vnc_basic_auth_password=$(openssl rand -hex 12)

    - name: Обновить apt-кэш
      apt:
        update_cache: true
        cache_valid_time: 3600

    - name: Установить базовые пакеты
      apt:
        name:
          - curl
          - git
          - nginx
          - certbot
          - python3-certbot-nginx
        state: present

    - name: Проверить наличие Node.js
      stat:
        path: /usr/bin/node
      register: node_bin

    - name: "Установить Node.js {{ node_version }}.x"
      shell: |
        curl -fsSL https://deb.nodesource.com/setup_{{ node_version }}.x | bash -
        apt-get install -y nodejs
      when: not node_bin.stat.exists

    - name: Установить pm2 глобально
      npm:
        name: pm2
        global: true

    - name: Проверить наличие Coolify
      stat:
        path: /data/coolify/source/.env
      register: coolify_installed

    - name: Установить Coolify (Docker + control-plane)
      shell: curl -fsSL https://cdn.coollabs.io/coolify/install.sh | bash
      when: not coolify_installed.stat.exists

    # Before the nginx vhosts: hub's config references /etc/nginx/.vnc_htpasswd
    # (auth_basic_user_file) via extra_locations - nginx refuses to reload if
    # that file doesn't exist yet, so this has to create it first.
    - name: Установить и запустить parser-worker (Xvfb, noVNC, FastAPI)
      include_tasks: tasks/setup_parser_worker.yml

    - name: Проверить наличие контейнера LibreTranslate
      command: docker inspect libretranslate
      register: libretranslate_inspect
      changed_when: false
      failed_when: false

    - name: "Запустить LibreTranslate (перевод RU→EN для карточек идей, без внешнего API)"
      command: >
        docker run -d --name libretranslate --restart unless-stopped --network coolify
        -e LT_LOAD_ONLY=en,ru -e LT_DISABLE_WEB_UI=true -e LT_UPDATE_MODELS=false
        libretranslate/libretranslate:latest
      when: libretranslate_inspect.rc != 0

    - name: Настроить nginx-vhost + SSL для каждого сайта
      include_tasks: tasks/setup_site.yml
      loop: "{{ sites }}"
      loop_control:
        loop_var: site

  handlers:
    - name: reload systemd
      systemd:
        daemon_reload: true
